session_name: s0
windows:
  - window_name: seeder
    layout: tiled
    panes:
      - shell_command:
        # deconstitution
          - source $VTRSRC/main/install/setup.bash
          - export ROBOT_ID=0
          - cd $VTRROOT/torrent_ws/scripts
          - rm -r $VTRTEMP/pcs/utias/0
          - python3 posegraph/live_deconstitution.py -p utias
      - shell_command:
        # mutable seeder
          - source $VTRSRC/main/install/setup.bash
          - cd $VTRROOT/torrent_ws/scripts
          - python3 torrent/mutable_seeder.py -r 0
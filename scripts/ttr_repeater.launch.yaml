## Teach, Torrent, Repeat: VTR3 + orchestrator + torrent_planner in one detached session
## Load with:  tmuxp load -d ttr_repeater.launch.yaml   (start_ttr.sh does this for you)
session_name: ttr

environment:
  RMW_IMPLEMENTATION: rmw_zenoh_cpp
  ZENOH_ROUTER_CONFIG_URI: $VTRROOT/hunter/hunter2_zenoh.json5
  TTR_POSEGRAPH: ${TTR_POSEGRAPH}   # passed in by start_ttr.sh
  TTR_POLICY: ${TTR_POLICY}         # passed in by start_ttr.sh (piece-picker policy)

start_directory: ${VTRTEMP}
suppress_history: false

windows:
  # ---- 1. VTR (unchanged from online_ouster_hunter.launch.yaml) -------------
  - window_name: vtr_navigation_system
    layout: main-horizontal
    shell_command_before:
      - source ${VTRSRC}/main/install/setup.bash
      - ros2 run vtr_gui setup_client  --ros-args -r __ns:=/$ROBOT_NAME/vtr
    panes:
      - >
        ros2 launch vtr_navigation vtr_hunters.launch.py
        base_params:=ouster_hunter_default.yaml
        start_new_graph:=false
        use_sim_time:=false
        planner:="bicycle_mpc"
        command_topic:=/$ROBOT_NAME/cmd_vel
        model_dir:=${VTRROOT}/models

  - window_name: vtr_gui
    layout: main-horizontal
    shell_command_before:
      - source ${VTRSRC}/main/install/setup.bash
    panes:
      - ros2 run vtr_gui socket_client  --ros-args -r __ns:=/$ROBOT_NAME/vtr
      - ros2 run vtr_gui socket_server  --ros-args -r __ns:=/$ROBOT_NAME/vtr
      - ros2 run vtr_gui web_server  --ros-args -r __ns:=/$ROBOT_NAME/vtr
      - ros2 run vtr_gui setup_server  --ros-args -r __ns:=/$ROBOT_NAME/vtr

  # ---- 2. Orchestrator: waits for VTR, then starts --------------------------
  - window_name: orchestrator
    shell_command_before:
      - source ${VTRSRC}/main/install/setup.bash
      - source ~/ASRL/vtr3/torrent_ws/install/setup.bash
      - cd ~/ASRL/vtr3/torrent_ws/scripts
    panes:
      - python3 orchestrator.py -p $TTR_POSEGRAPH -r $TTR_POLICY

  # ---- 3. Torrent planner: waits for VTR, then starts -----------------------
  - window_name: torrent_planner
    shell_command_before:
      - source ${VTRSRC}/main/install/setup.bash
      - source ~/ASRL/vtr3/torrent_ws/install/setup.bash
      - cd ~/ASRL/vtr3/torrent_ws/scripts
    panes:
      - bash wait_for_vtr.sh && ros2 run torrent_planner torrent_planner
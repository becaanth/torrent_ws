session_name: dev_peer
windows:
  - window_name: peer
    layout: tiled
    panes:
      # - shell_command:
      #   # zenoh router
      #     - zenohd --cfg 'scouting/multicast/enabled:false'
      - shell_command:
        # peer 
          - source $VTRSRC/main/install/setup.bash
          - cd $VTRROOT/torrent_ws/scripts
          - rm -r $VTRTEMP/torrent_pcs/utias
          - python3 -m torrent.mutable_peer
      - shell_command:
        # reconstitution
          - source $VTRSRC/main/install/setup.bash
          - cd $VTRROOT/torrent_ws/scripts
          - rm -r $VTRTEMP/pgs/rutias
          - python3 -m posegraph.live_reconstitution -p utias --piece_root /home/asrl/ASRL/vtr3/temp/torrent_pcs